<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'Inter-Regular';src:url('./fonts/Inter-Regular.otf')}
@font-face{font-family:'Inter-Medium';src:url('./fonts/Inter-Medium.otf')}
@font-face{font-family:'Inter-SemiBold';src:url('./fonts/Inter-SemiBold.otf')}
@font-face{font-family:'Inter-Bold';src:url('./fonts/Inter-Bold.otf')}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Inter-Regular',sans-serif;-webkit-font-smoothing:antialiased;touch-action:none;user-select:none}
#root{position:fixed;inset:0;display:flex;flex-direction:column}
div,span,svg{pointer-events:auto}

</style></head>
<body><div id="root"></div><script src="./app.js"></script></body></html>
